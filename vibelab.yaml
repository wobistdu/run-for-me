app:
  id: "7710228625718689843"
  name: 替我跑
  slogan: " Cyber 分身替你完成跑步"
  description: |-
    把虚拟越野沙盘**搬进 PICO 共享空间**——它就摆在你家的书桌上。

    沙盘中有两条山野线路：
    - **林溪线**：有潺潺流水和林间土路，适合喜欢清新绿意的朋友；
    - **陆野线**：是开阔的砂石旷野，更有越野跑的原始感。

    你可以任选一条路线，让虚拟跑者**自动巡跑**。跑者会随着地形自动做出拟真动作：
    - 跑上**独木桥**时，他会自动展开双臂找平衡；
    - 遇到**低门**时，又会弯膝俯身穿过去。
    这些动作都由 **AI 根据地形实时生成**，每一次跑动都有自然的临场感。

    ## 两种玩法，轻松沉浸
    ### 🏅 今日寻星
    每天打开都有新挑战：
    1. 看向沙盘中的**金色五角星**；
    2. 捏合再松开，把星摘下来；
    3. 用三面小旗依次收齐三颗星，就算完成当日打卡。

    打卡节奏可以自己掌握，几分钟就能跑完一局，适合每天随手来一次。

    ### 🏕️ 自由玩山野
    不想被任务限定？可以自由改造山路：
    - **插旗带路**：手动指定跑者路线；
    - **拖动地形**：捏住地面就能调整山路起伏，搭出你喜欢的小坡道。

    ## 数据板与打卡徽章
    沙盘旁的数据板会帮你记录：
    - 虚拟跑者的**里程**
    - **爬升高度**
    - **连续跑动天数**

    累计完成「今日寻星」打卡：
    - 第 **1 天** 点亮第一枚徽章
    - 第 **3 天** 点亮第二枚徽章
    - 第 **7 天** 点亮第三枚徽章

    每枚徽章都是**立体造型**，可以拿在手里旋转查看，成就感拉满。
