app:
  id: '7710228625718689843'
  name: 自在跑
  slogan: 你负责放松，分身负责跑山｜AI 随地形生成动作的桌面越野沙盘
  description: '你歇一会儿，你的分身已经跑进山里


    《自在跑》把一片能玩、能改、能陪伴你的微缩山野，放进 PICO 共享空间

    看分身在桌上自在巡跑，看里程一点点增长，也可以随手插旗，带它去你想去的地方


    ## 路变了，动作也跟着变

    每一步都在响应眼前的地形

    PFNN 神经网络结合前方轨迹、地形高度和上一帧身体状态，实时推理角色动作

    走上独木桥，展开双臂保持平衡；穿过低门，俯身屈膝；遇到上下坡和乱石，步态随地面起伏调整

    你捏出一段山路，就能近距离看它怎样跑过去


    ## 每天三颗星，轻松完成一次小冒险

    看向星星，捏合再松开，就在星星处插下一面红旗

    分身会立即出发，沿着贴地细线依次收集星星

    每天收齐三颗完成打卡，试试只用三面旗拿到三星评价


    ## 想怎么跑，你来带路

    自由插旗设置路线，跑到一面收掉一面；也可以捏山修路，改变坡面起伏

    支持调节速度、暂停和切换跑者，不用手柄，也能轻松玩


    ## 把陪伴变成看得见的积累

    数据板每秒更新虚拟跑者的今日与累计里程、爬升、热量估算、寻星总数和连续跑动天数

    每日跑量榜显示前十名，让你的分身也有一起跑山的伙伴

    寻星打卡累计 1、3、7 天，点亮晨光、溪蓝、暮紫三枚立体金属徽章，解锁后可旋转欣赏


    你负责享受山野，它负责继续向前


    里程、爬升与热量均为虚拟角色的游戏数据，热量按 73 kg 角色结合距离和爬升估算，不代表佩戴者的实际运动消耗'
  tags:
  - 休闲益智
  category: game
  icon: release-assets/icon.png
  landscape: release-assets/landscape.jpg
  detail_images:
  - release-assets/bridge-front.jpg
  - release-assets/bridge-side.jpg
  - release-assets/low-gate-front.jpg
  - release-assets/low-gate-side.jpg
  - release-assets/detail.jpg
  videos: []
version:
  name: 0.3.4
  notes: '【自在跑 0.3.4】

    - 应用名更新为自在跑，保留原有角色、里程与打卡记录

    - 接通 PPS 每日跑量排行榜，展示前十名用户名和今日跑量

    - 简化寻星界面，放大星标与名称，优化插旗引导

    - 热量改为按 73 kg 虚拟角色结合跑动距离与爬升估算

    - 修复徽章背面显示、角色切换残留等体验问题

    - PFNN 根据轨迹和地形持续推理跑步动作，保留独木桥平衡及低门姿态'
build:
  repo_url: https://github.com/wobistdu/run-for-me
  repo_visibility: public
  tech_stack: android_spatial
  ai_tool: Codex
  ai_model: GPT-6
  features:
  - hand_tracking
  - mixed_reality
  teammates: []
